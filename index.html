<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Android Style Calculator</title><script src="https://cdn.tailwindcss.com"></script><style>body { background-color: #121212; }</style></head><body class="flex items-center justify-center min-h-screen p-4"><div class="w-full max-w-sm bg-[#121212] p-6 rounded-3xl"><div class="flex flex-col justify-end h-48 mb-6"><input type="text" id="display" class="w-full bg-transparent text-right text-6xl text-white font-light focus:outline-none" disabled placeholder="0"></div><div class="grid grid-cols-4 gap-3"><button onclick="clearDisplay()" class="p-6 bg-[#333333] text-[#a5d6ff] rounded-full text-2xl font-medium">AC</button><button onclick="appendToDisplay('/')" class="p-6 bg-[#333333] text-[#a5d6ff] rounded-full text-2xl font-medium">/</button><button onclick="appendToDisplay('*')" class="p-6 bg-[#333333] text-[#a5d6ff] rounded-full text-2xl font-medium">×</button><button onclick="deleteLast()" class="p-6 bg-[#333333] text-[#f28b82] rounded-full text-2xl font-medium">DEL</button><button onclick="appendToDisplay('7')" class="p-6 bg-[#1e1e1e] text-white rounded-full text-2xl">7</button><button onclick="appendToDisplay('8')" class="p-6 bg-[#1e1e1e] text-white rounded-full text-2xl">8</button><button onclick="appendToDisplay('9')" class="p-6 bg-[#1e1e1e] text-white rounded-full text-2xl">9</button><button onclick="appendToDisplay('-')" class="p-6 bg-[#f28b82] text-white rounded-full text-2xl">-</button><button onclick="appendToDisplay('4')" class="p-6 bg-[#1e1e1e] text-white rounded-full text-2xl">4</button><button onclick="appendToDisplay('5')" class="p-6 bg-[#1e1e1e] text-white rounded-full text-2xl">5</button><button onclick="appendToDisplay('6')" class="p-6 bg-[#1e1e1e] text-white rounded-full text-2xl">6</button><button onclick="appendToDisplay('+')" class="p-6 bg-[#f28b82] text-white rounded-full text-2xl">+</button><button onclick="appendToDisplay('1')" class="p-6 bg-[#1e1e1e] text-white rounded-full text-2xl">1</button><button onclick="appendToDisplay('2')" class="p-6 bg-[#1e1e1e] text-white rounded-full text-2xl">2</button><button onclick="appendToDisplay('3')" class="p-6 bg-[#1e1e1e] text-white rounded-full text-2xl">3</button><button onclick="calculate()" class="row-span-2 p-6 bg-[#8ab4f8] text-[#121212] rounded-full text-4xl font-bold">=</button><button onclick="appendToDisplay('0')" class="col-span-2 p-6 bg-[#1e1e1e] text-white rounded-full text-2xl">0</button><button onclick="appendToDisplay('.')" class="p-6 bg-[#1e1e1e] text-white rounded-full text-2xl">.</button></div></div><script>const display = document.getElementById('display');function appendToDisplay(val) { display.value += val; }function clearDisplay() { display.value = ''; }function deleteLast() { display.value = display.value.slice(0, -1); }function calculate() { try { display.value = eval(display.value); } catch { display.value = 'Error'; } }</script></body></html>
