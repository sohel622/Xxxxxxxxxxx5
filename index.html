<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>আধুনিক ক্যালকুলেটর</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 flex items-center justify-center min-h-screen"><div class="bg-white p-6 rounded-2xl shadow-xl w-80"><input type="text" id="display" class="w-full mb-4 p-4 text-right text-2xl border rounded-lg bg-gray-50" disabled><div class="grid grid-cols-4 gap-2"><button onclick="clearDisplay()" class="col-span-2 p-4 bg-red-500 text-white rounded-lg">C</button><button onclick="appendToDisplay('/')" class="p-4 bg-gray-200 rounded-lg">/</button><button onclick="appendToDisplay('*')" class="p-4 bg-gray-200 rounded-lg">*</button><button onclick="appendToDisplay('7')" class="p-4 bg-gray-100 rounded-lg">7</button><button onclick="appendToDisplay('8')" class="p-4 bg-gray-100 rounded-lg">8</button><button onclick="appendToDisplay('9')" class="p-4 bg-gray-100 rounded-lg">9</button><button onclick="appendToDisplay('-')" class="p-4 bg-gray-200 rounded-lg">-</button><button onclick="appendToDisplay('4')" class="p-4 bg-gray-100 rounded-lg">4</button><button onclick="appendToDisplay('5')" class="p-4 bg-gray-100 rounded-lg">5</button><button onclick="appendToDisplay('6')" class="p-4 bg-gray-100 rounded-lg">6</button><button onclick="appendToDisplay('+')" class="p-4 bg-gray-200 rounded-lg">+</button><button onclick="appendToDisplay('1')" class="p-4 bg-gray-100 rounded-lg">1</button><button onclick="appendToDisplay('2')" class="p-4 bg-gray-100 rounded-lg">2</button><button onclick="appendToDisplay('3')" class="p-4 bg-gray-100 rounded-lg">3</button><button onclick="calculate()" class="row-span-2 p-4 bg-blue-500 text-white rounded-lg">=</button><button onclick="appendToDisplay('0')" class="col-span-2 p-4 bg-gray-100 rounded-lg">0</button><button onclick="appendToDisplay('.')" class="p-4 bg-gray-100 rounded-lg">.</button></div></div><script>const display = document.getElementById('display');function appendToDisplay(val) { display.value += val; }function clearDisplay() { display.value = ''; }function calculate() { try { display.value = eval(display.value); } catch { display.value = 'Error'; } }</script></body></html>
