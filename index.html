<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Modern Calculator App</title><script src="https://cdn.tailwindcss.com"></script><style>body { background: radial-gradient(circle at center, #1a1a2e 0%, #16213e 100%); }</style></head><body class="flex items-center justify-center min-h-screen p-4"><div class="bg-white/5 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-white/10 w-full max-w-sm"><h1 class="text-white/80 text-center text-lg font-light tracking-widest mb-6 uppercase">Calculator</h1><input type="text" id="display" class="w-full mb-6 p-6 text-right text-4xl font-light text-white rounded-2xl bg-black/30 border border-white/5 focus:outline-none" disabled placeholder="0"><div class="grid grid-cols-4 gap-3"><button onclick="clearDisplay()" class="col-span-2 p-5 bg-rose-500/20 hover:bg-rose-500/40 text-rose-200 rounded-2xl font-medium transition">AC</button><button onclick="appendToDisplay('/')" class="p-5 bg-white/5 hover:bg-white/10 text-blue-300 rounded-2xl font-medium transition">/</button><button onclick="appendToDisplay('*')" class="p-5 bg-white/5 hover:bg-white/10 text-blue-300 rounded-2xl font-medium transition">×</button><button onclick="appendToDisplay('7')" class="p-5 bg-white/5 hover:bg-white/10 text-white rounded-2xl font-medium transition">7</button><button onclick="appendToDisplay('8')" class="p-5 bg-white/5 hover:bg-white/10 text-white rounded-2xl font-medium transition">8</button><button onclick="appendToDisplay('9')" class="p-5 bg-white/5 hover:bg-white/10 text-white rounded-2xl font-medium transition">9</button><button onclick="appendToDisplay('-')" class="p-5 bg-white/5 hover:bg-white/10 text-blue-300 rounded-2xl font-medium transition">-</button><button onclick="appendToDisplay('4')" class="p-5 bg-white/5 hover:bg-white/10 text-white rounded-2xl font-medium transition">4</button><button onclick="appendToDisplay('5')" class="p-5 bg-white/5 hover:bg-white/10 text-white rounded-2xl font-medium transition">5</button><button onclick="appendToDisplay('6')" class="p-5 bg-white/5 hover:bg-white/10 text-white rounded-2xl font-medium transition">6</button><button onclick="appendToDisplay('+')" class="p-5 bg-white/5 hover:bg-white/10 text-blue-300 rounded-2xl font-medium transition">+</button><button onclick="appendToDisplay('1')" class="p-5 bg-white/5 hover:bg-white/10 text-white rounded-2xl font-medium transition">1</button><button onclick="appendToDisplay('2')" class="p-5 bg-white/5 hover:bg-white/10 text-white rounded-2xl font-medium transition">2</button><button onclick="appendToDisplay('3')" class="p-5 bg-white/5 hover:bg-white/10 text-white rounded-2xl font-medium transition">3</button><button onclick="calculate()" class="row-span-2 p-5 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-bold transition">=</button><button onclick="appendToDisplay('0')" class="col-span-2 p-5 bg-white/5 hover:bg-white/10 text-white rounded-2xl font-medium transition">0</button><button onclick="appendToDisplay('.')" class="p-5 bg-white/5 hover:bg-white/10 text-white rounded-2xl font-medium transition">.</button></div></div><script>const display = document.getElementById('display');function appendToDisplay(val) { display.value += val; }function clearDisplay() { display.value = ''; }function calculate() { try { display.value = eval(display.value); } catch { display.value = 'Error'; } }</script></body></html>
