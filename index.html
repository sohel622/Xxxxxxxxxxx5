<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Social Video Feed</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white min-h-screen flex flex-col"><main id="app" class="flex-1 overflow-y-auto p-4"><div id="feed" class="space-y-6"></div></main><nav class="fixed bottom-0 w-full bg-zinc-900 border-t border-zinc-800 flex justify-around p-4"><button onclick="showSection('home')" class="text-white">Home</button><button onclick="showSection('upload')" class="text-white">Upload</button><button onclick="showSection('profile')" class="text-white">Profile</button></nav><script>let videos = JSON.parse(localStorage.getItem('videos') || '[]'); const feed = document.getElementById('feed'); function renderFeed() { feed.innerHTML = videos.map(v => `<video src="${v}" class="w-full rounded-xl" controls></video>`).join(''); } function showSection(section) { if(section === 'upload') { const url = prompt('Enter Video URL:'); if(url) { videos.push(url); localStorage.setItem('videos', JSON.stringify(videos)); renderFeed(); } } else if(section === 'profile') { feed.innerHTML = '<div class="text-center mt-20"><h1>User Profile</h1><p>Videos Uploaded: ' + videos.length + '</p></div>'; } else { renderFeed(); } } renderFeed();</script></body></html>
