<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Social Video Feed</title><script src="https://cdn.tailwindcss.com"></script><style>.tap-effect:active { transform: scale(0.95); transition: transform 0.1s; }</style></head><body class="bg-black text-white min-h-screen flex flex-col"><main id="app" class="flex-1 overflow-y-auto p-4 pb-24"><div id="feed" class="space-y-6"></div></main><nav class="fixed bottom-0 w-full bg-zinc-900/90 backdrop-blur-md border-t border-zinc-800 flex justify-around p-3 shadow-lg"><button onclick="showSection('home')" class="tap-effect flex flex-col items-center text-blue-400"><span>🏠</span><span class="text-[10px]">Home</span></button><button onclick="document.getElementById('fileInput').click()" class="tap-effect flex flex-col items-center text-white"><span>➕</span><span class="text-[10px]">Upload</span></button><button onclick="showSection('profile')" class="tap-effect flex flex-col items-center text-white"><span>👤</span><span class="text-[10px]">Profile</span></button></nav><input type="file" id="fileInput" accept="video/*" class="hidden" onchange="handleUpload(event)"><script>let videos = JSON.parse(localStorage.getItem('videos') || '[]'); const feed = document.getElementById('feed'); function renderFeed() { feed.innerHTML = videos.length ? videos.map(v => `<video src="${v}" class="w-full rounded-2xl bg-zinc-800" controls></video>`).join('') : '<p class="text-center text-zinc-500 mt-20">কোনো ভিডিও নেই</p>'; } function handleUpload(e) { const file = e.target.files[0]; if(file) { const url = URL.createObjectURL(file); videos.push(url); localStorage.setItem('videos', JSON.stringify(videos)); renderFeed(); } } function showSection(section) { if(section === 'profile') { feed.innerHTML = `<div class="text-center mt-20"><div class="w-24 h-24 bg-zinc-800 rounded-full mx-auto mb-4"></div><h1 class="text-xl font-bold">ব্যবহারকারী</h1><p class="text-zinc-400">আপলোড করা ভিডিও: ${videos.length}</p></div>`; } else { renderFeed(); } } renderFeed();</script></body></html>
