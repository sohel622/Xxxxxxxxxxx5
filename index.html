<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>আধুনিক ক্যালকুলেটর অ্যাপ</title><script src="https://cdn.tailwindcss.com"></script><style>body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }</style></head><body class="flex items-center justify-center min-h-screen p-4"><div class="bg-white/10 backdrop-blur-lg p-8 rounded-3xl shadow-2xl border border-white/20 w-full max-w-sm"><h1 class="text-white text-center text-xl font-bold mb-6">ক্যালকুলেটর</h1><input type="text" id="display" class="w-full mb-6 p-6 text-right text-3xl font-mono rounded-2xl bg-black/20 text-white border-none focus:outline-none" disabled placeholder="0"><div class="grid grid-cols-4 gap-3"><button onclick="clearDisplay()" class="col-span-2 p-5 bg-red-500/80 hover:bg-red-600 text-white rounded-2xl font-bold transition">C</button><button onclick="appendToDisplay('/')" class="p-5 bg-white/20 hover:bg-white/30 text-white rounded-2xl font-bold transition">/</button><button onclick="appendToDisplay('*')" class="p-5 bg-white/20 hover:bg-white/30 text-white rounded-2xl font-bold transition">×</button><button onclick="appendToDisplay('7')" class="p-5 bg-white/10 hover:bg-white/20 text-white rounded-2xl font-bold transition">7</button><button onclick="appendToDisplay('8')" class="p-5 bg-white/10 hover:bg-white/20 text-white rounded-2xl font-bold transition">8</button><button onclick="appendToDisplay('9')" class="p-5 bg-white/10 hover:bg-white/20 text-white rounded-2xl font-bold transition">9</button><button onclick="appendToDisplay('-')" class="p-5 bg-white/20 hover:bg-white/30 text-white rounded-2xl font-bold transition">-</button><button onclick="appendToDisplay('4')" class="p-5 bg-white/10 hover:bg-white/20 text-white rounded-2xl font-bold transition">4</button><button onclick="appendToDisplay('5')" class="p-5 bg-white/10 hover:bg-white/20 text-white rounded-2xl font-bold transition">5</button><button onclick="appendToDisplay('6')" class="p-5 bg-white/10 hover:bg-white/20 text-white rounded-2xl font-bold transition">6</button><button onclick="appendToDisplay('+')" class="p-5 bg-white/20 hover:bg-white/30 text-white rounded-2xl font-bold transition">+</button><button onclick="appendToDisplay('1')" class="p-5 bg-white/10 hover:bg-white/20 text-white rounded-2xl font-bold transition">1</button><button onclick="appendToDisplay('2')" class="p-5 bg-white/10 hover:bg-white/20 text-white rounded-2xl font-bold transition">2</button><button onclick="appendToDisplay('3')" class="p-5 bg-white/10 hover:bg-white/20 text-white rounded-2xl font-bold transition">3</button><button onclick="calculate()" class="row-span-2 p-5 bg-blue-500 hover:bg-blue-600 text-white rounded-2xl font-bold transition">=</button><button onclick="appendToDisplay('0')" class="col-span-2 p-5 bg-white/10 hover:bg-white/20 text-white rounded-2xl font-bold transition">0</button><button onclick="appendToDisplay('.')" class="p-5 bg-white/10 hover:bg-white/20 text-white rounded-2xl font-bold transition">.</button></div></div><script>const display = document.getElementById('display');function appendToDisplay(val) { display.value += val; }function clearDisplay() { display.value = ''; }function calculate() { try { display.value = eval(display.value); } catch { display.value = 'Error'; } }</script></body></html>
