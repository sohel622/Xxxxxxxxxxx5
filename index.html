<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Social Video Feed</title><script src="https://cdn.tailwindcss.com"></script><style>.tap-effect:active { transform: scale(0.95); transition: transform 0.1s; }</style></head><body class="bg-black text-white min-h-screen flex flex-col"><main id="app" class="flex-1 overflow-y-auto p-4 pb-24"><div id="feed" class="space-y-8"></div></main><nav class="fixed bottom-0 w-full bg-zinc-900/95 backdrop-blur-lg border-t border-zinc-800 flex justify-around p-3 shadow-2xl"><button onclick="showSection('home')" class="tap-effect flex flex-col items-center text-blue-400"><span>🏠</span><span class="text-[10px]">Home</span></button><button onclick="document.getElementById('fileInput').click()" class="tap-effect flex flex-col items-center text-white"><span>➕</span><span class="text-[10px]">Upload</span></button><button onclick="showSection('profile')" class="tap-effect flex flex-col items-center text-white"><span>👤</span><span class="text-[10px]">Profile</span></button></nav><input type="file" id="fileInput" accept="video/*" class="hidden" onchange="handleUpload(event)"><script>let videos = JSON.parse(localStorage.getItem('videos') || '[]'); const feed = document.getElementById('feed'); function renderFeed() { feed.innerHTML = videos.length ? videos.map((v, i) => `<div class="bg-zinc-900 rounded-3xl p-2 shadow-xl"><video src="${v.url}" class="w-full rounded-2xl bg-black" controls></video><div class="flex items-center justify-between px-2 py-3"><button onclick="toggleLike(${i})" class="tap-effect text-2xl">${v.liked ? '❤️' : '🤍'}</button><span class="text-xs text-zinc-400">${v.liked ? 'Liked' : 'Like'}</span></div></div>`).join('') : '<p class="text-center text-zinc-500 mt-20">কোনো ভিডিও নেই</p>'; } function toggleLike(index) { videos[index].liked = !videos[index].liked; localStorage.setItem('videos', JSON.stringify(videos)); renderFeed(); } function handleUpload(e) { const file = e.target.files[0]; if(file) { const url = URL.createObjectURL(file); videos.push({url, liked: false}); localStorage.setItem('videos', JSON.stringify(videos)); renderFeed(); } } function showSection(section) { if(section === 'profile') { feed.innerHTML = `<div class="text-center mt-20"><div class="w-24 h-24 bg-gradient-to-tr from-blue-500 to-purple-500 rounded-full mx-auto mb-4 flex items-center justify-center text-4xl">👤</div><h1 class="text-xl font-bold">সোহেল আহমেদ</h1><p class="text-zinc-400">আপলোড করা ভিডিও: ${videos.length}</p></div>`; } else { renderFeed(); } } renderFeed();</script></body></html>
