<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Modern Android Calculator</title><script src="https://cdn.tailwindcss.com"></script><style>body { background: #121212; }</style></head><body class="flex items-center justify-center min-h-screen p-4"><div id="app" class="bg-[#1e1e1e] p-6 rounded-[40px] shadow-2xl w-full max-w-sm border border-white/5"><input type="text" id="display" class="w-full mb-8 p-6 text-right text-5xl font-light text-white bg-transparent focus:outline-none" disabled placeholder="0"><div class="grid grid-cols-4 gap-3"><button onclick="handleInput('AC')" class="col-span-2 p-6 bg-[#333] hover:bg-[#444] active:scale-95 transition-all text-rose-400 rounded-full text-xl">AC</button><button onclick="handleInput('/')" class="p-6 bg-[#333] hover:bg-[#444] active:scale-95 transition-all text-blue-400 rounded-full text-xl">/</button><button onclick="handleInput('*')" class="p-6 bg-[#333] hover:bg-[#444] active:scale-95 transition-all text-blue-400 rounded-full text-xl">×</button><button onclick="handleInput('7')" class="p-6 bg-[#2a2a2a] hover:bg-[#3a3a3a] active:scale-95 transition-all text-white rounded-full text-xl">7</button><button onclick="handleInput('8')" class="p-6 bg-[#2a2a2a] hover:bg-[#3a3a3a] active:scale-95 transition-all text-white rounded-full text-xl">8</button><button onclick="handleInput('9')" class="p-6 bg-[#2a2a2a] hover:bg-[#3a3a3a] active:scale-95 transition-all text-white rounded-full text-xl">9</button><button onclick="handleInput('-')" class="p-6 bg-[#333] hover:bg-[#444] active:scale-95 transition-all text-blue-400 rounded-full text-xl">-</button><button onclick="handleInput('4')" class="p-6 bg-[#2a2a2a] hover:bg-[#3a3a3a] active:scale-95 transition-all text-white rounded-full text-xl">4</button><button onclick="handleInput('5')" class="p-6 bg-[#2a2a2a] hover:bg-[#3a3a3a] active:scale-95 transition-all text-white rounded-full text-xl">5</button><button onclick="handleInput('6')" class="p-6 bg-[#2a2a2a] hover:bg-[#3a3a3a] active:scale-95 transition-all text-white rounded-full text-xl">6</button><button onclick="handleInput('+')" class="p-6 bg-[#333] hover:bg-[#444] active:scale-95 transition-all text-blue-400 rounded-full text-xl">+</button><button onclick="handleInput('1')" class="p-6 bg-[#2a2a2a] hover:bg-[#3a3a3a] active:scale-95 transition-all text-white rounded-full text-xl">1</button><button onclick="handleInput('2')" class="p-6 bg-[#2a2a2a] hover:bg-[#3a3a3a] active:scale-95 transition-all text-white rounded-full text-xl">2</button><button onclick="handleInput('3')" class="p-6 bg-[#2a2a2a] hover:bg-[#3a3a3a] active:scale-95 transition-all text-white rounded-full text-xl">3</button><button onclick="handleInput('=')" class="row-span-2 p-6 bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all text-white rounded-full text-xl">=</button><button onclick="handleInput('0')" class="col-span-2 p-6 bg-[#2a2a2a] hover:bg-[#3a3a3a] active:scale-95 transition-all text-white rounded-full text-xl">0</button><button onclick="handleInput('.')" class="p-6 bg-[#2a2a2a] hover:bg-[#3a3a3a] active:scale-95 transition-all text-white rounded-full text-xl">.</button></div></div><script type="module">import { appendToDisplay, clearDisplay, calculate } from './src/utils/calculator.js'; const display = document.getElementById('display'); window.handleInput = (val) => { if (val === 'AC') display.value = clearDisplay(); else if (val === '=') display.value = calculate(display.value); else display.value = appendToDisplay(display.value, val); };</script></body></html>
